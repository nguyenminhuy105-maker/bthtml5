<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 1 - Giày Sneaker XYZ</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            color: #222;
        }

        header {
            background: #2c3e50;
            color: white;
            padding: 16px 24px;
        }

        main {
            max-width: 800px;
            margin: auto;
            padding: 0 24px;
        }

        section {
            margin-top: 32px;
        }

        img {
            width: 100%;
            border-radius: 6px;
            display: block;
        }

        video {
            width: 100%;
            max-width: 640px;
        }

        footer {
            text-align: center;
            padding: 16px;
            color: #777;
        }
    </style>
</head>

<body>

<header>
    <h1>Giày Sneaker XYZ</h1>
</header>

<main>

    <!-- Banner responsive -->
    <section>
        <picture>
            <source
                media="(max-width: 600px)"
                srcset="https://picsum.photos/id/21/600/300">

            <source
                media="(max-width: 1200px)"
                srcset="https://picsum.photos/id/21/900/400">

            <img
                src="https://picsum.photos/id/21/1200/500"
                alt="Banner giới thiệu giày sneaker XYZ">
        </picture>
    </section>

    <!-- Chi tiết sản phẩm -->
    <section>
        <h2>Chi tiết sản phẩm</h2>

        <img
            src="https://picsum.photos/id/103/800/600"
            srcset="
                https://picsum.photos/id/103/400/300 400w,
                https://picsum.photos/id/103/800/600 800w,
                https://picsum.photos/id/103/1200/900 1200w"
            sizes="(max-width: 600px) 100vw, 800px"
            alt="Chi tiết giày sneaker XYZ">

        <p>
            Giày sneaker XYZ - thiết kế tối giản,
            đế cao su chống trơn, phù hợp mọi trang phục.
        </p>
    </section>

    <!-- Video -->
    <section>
        <h2>Video giới thiệu</h2>

        <video controls
            poster="https://picsum.photos/id/26/640/360">

            <source
                src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4"
                type="video/mp4">

            Trình duyệt không hỗ trợ video HTML5.
        </video>
    </section>

    <!-- Audio -->
    <section>
        <h2>Nghe giới thiệu sản phẩm</h2>

        <audio controls>
            <source
                src="https://interactive-examples.mdn.mozilla.net/media/cc0-audio/t-rex-roar.mp3"
                type="audio/mpeg">

            Trình duyệt không hỗ trợ audio HTML5.
        </audio>
    </section>

</main>

<footer>
    <p>&copy; 2026 Shop Sneaker XYZ</p>
</footer>

</body>
</html>
